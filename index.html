<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automotive HMI Cluster</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2016%2016'%3E%3Ccircle%20cx='8'%20cy='8'%20r='7'%20fill='%232563eb'/%3E%3C/svg%3E">
    <style>
      :root{
        --page-1:#eef3fa; --page-2:#dbe4f1;
        --surface:#ffffff; --card:#f4f8fd; --card-2:#e9f1fc;
        --ink:#0f1c30; --text:#3a4a63; --dim:#8291a8;
        --accent:#2563eb; --accent-2:#4c86ff; --accent-soft:#e7effe;
        --line:rgba(16,32,64,.08); --line-2:rgba(16,32,64,.05); --screen:#080b11;
        --sh:0 1px 2px rgba(16,32,64,.05), 0 14px 34px rgba(16,32,64,.10);
      }
      *{ box-sizing:border-box; }
      html,body{ margin:0; height:100%; color:var(--text);
        font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
        -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; }
      body{ min-height:100vh; background:radial-gradient(130% 100% at 50% -15%, var(--page-1), var(--page-2)); }
      .num{ font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1; }

      .cockpit{ position:relative; min-height:100vh; display:flex; flex-direction:column;
        max-width:1460px; margin:0 auto; padding:22px 34px 0; overflow:hidden; }

      .topbar{ display:flex; align-items:center; justify-content:space-between; gap:16px; z-index:4; }
      .brand{ display:flex; align-items:center; gap:11px; font-weight:700; letter-spacing:3.5px;
        font-size:16px; color:var(--ink); }
      .brand b{ color:var(--accent); font-weight:800; }
      .brand .mark{ width:26px; height:26px; }
      .byline{ color:var(--dim); font-size:12.5px; letter-spacing:.4px; }

      .deck{ position:relative; z-index:3; flex:1; display:flex; align-items:stretch;
        justify-content:center; gap:28px; padding:28px 0 92px; }

      /* ---- instrument cluster (Unity) ---- */
      .cluster-pod{ position:relative; align-self:flex-start; flex:1 1 720px; max-width:830px; min-width:0; }
      .bezel{ position:relative; aspect-ratio:16/9; border-radius:24px; overflow:hidden;
        background:var(--surface); padding:14px; border:1px solid var(--line); box-shadow:var(--sh); }
      .screen{ position:relative; width:100%; height:100%; border-radius:16px; overflow:hidden;
        background:var(--screen); box-shadow:inset 0 0 0 1px rgba(255,255,255,.05); }
      #unity-canvas{ width:100%; height:100%; display:block; }
      .podlabel{ position:absolute; left:6px; right:6px; bottom:-27px; display:flex; align-items:center; gap:8px;
        color:var(--dim); font-size:12px; letter-spacing:.4px; }
      .live{ width:6px; height:6px; border-radius:50%; background:var(--accent); display:inline-block;
        animation:pulse 2.4s ease-in-out infinite; }

      #loading{ position:absolute; inset:0; z-index:5; display:flex; flex-direction:column;
        align-items:center; justify-content:center; gap:20px; background:var(--surface); transition:opacity .5s; }
      .lt{ font-weight:700; letter-spacing:6px; font-size:14px; color:var(--ink); }
      .lt b{ color:var(--accent); }
      #bar{ width:220px; height:4px; background:rgba(16,32,64,.10); border-radius:3px; overflow:hidden; }
      #bar>i{ display:block; height:100%; width:100%; background:var(--accent);
        transform:scaleX(0); transform-origin:left; transition:transform .2s; }
      #pct{ color:var(--dim); font-size:11px; letter-spacing:3px; }

      /* ---- center console / head unit ---- */
      .console{ flex:0 0 360px; max-width:360px; }
      .headunit{ background:var(--surface); border-radius:24px; border:1px solid var(--line);
        box-shadow:var(--sh); padding:17px; height:100%; display:flex; flex-direction:column;
        justify-content:space-between; gap:13px; }
      .hu-status{ display:flex; align-items:center; justify-content:space-between; padding:0 2px 1px; }
      .hu-status .clock{ color:var(--ink); font-weight:600; font-size:15px; letter-spacing:.5px; }
      .hu-status .right{ display:flex; align-items:center; gap:9px; }
      .ic{ width:15px; height:15px; color:var(--dim); display:block; }
      .wx{ background:var(--accent-soft); color:var(--accent); font-size:11px; font-weight:600;
        letter-spacing:.2px; padding:4px 10px; border-radius:999px; white-space:nowrap; }

      .card{ background:var(--card); border:1px solid var(--line-2); border-radius:16px; }

      .nav{ position:relative; height:138px; overflow:hidden; }
      .nav .map{ position:absolute; inset:0; width:100%; height:100%; }
      .nav .navinfo{ position:absolute; left:14px; bottom:13px; right:14px; display:flex; align-items:center; gap:12px; }
      .nav .arrow{ width:40px; height:40px; flex:none; display:flex; align-items:center; justify-content:center;
        background:var(--accent); border-radius:13px; box-shadow:0 6px 14px rgba(37,99,235,.35); }
      .nav .arrow svg{ width:23px; height:23px; }
      .nav .nroad{ min-width:0; }
      .nav .road{ font-weight:600; font-size:15px; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
      .nav .eta{ color:var(--dim); font-size:12px; margin-top:2px; }
      .nav .dist{ margin-left:auto; text-align:right; line-height:1.05; }
      .nav .dist b{ font-size:19px; font-weight:700; color:var(--accent); }
      .nav .dist span{ display:block; color:var(--dim); font-size:10.5px; letter-spacing:.6px; margin-top:1px; }

      .media{ display:flex; align-items:center; gap:13px; padding:13px; }
      .media .art{ position:relative; width:48px; height:48px; border-radius:11px; flex:none; overflow:hidden;
        background:linear-gradient(135deg,var(--accent),var(--accent-2)); }
      .media .eq{ position:absolute; inset:0; display:flex; align-items:flex-end; justify-content:center; gap:2.5px; padding:11px; }
      .media .eq i{ width:3px; height:100%; border-radius:2px; background:rgba(255,255,255,.92);
        transform:scaleY(.4); transform-origin:bottom; animation:eq 1s ease-in-out infinite; }
      .media .eq i:nth-child(2){ animation-delay:.22s; } .media .eq i:nth-child(3){ animation-delay:.44s; }
      .media .meta{ min-width:0; flex:1; }
      .media .title{ font-weight:600; font-size:14px; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
      .media .artist{ color:var(--dim); font-size:12px; margin-top:1px; }
      .media .prog{ height:3px; background:rgba(16,32,64,.10); border-radius:2px; margin-top:9px; overflow:hidden; }
      .media .prog>i{ display:block; height:100%; width:100%; background:var(--accent);
        transform:scaleX(.42); transform-origin:left; transition:transform .9s linear; }
      .media .ctrl{ display:flex; gap:6px; }
      .media .ctrl button{ width:32px; height:32px; border:none; border-radius:9px; cursor:pointer;
        background:var(--accent-soft); color:var(--accent); display:flex; align-items:center; justify-content:center;
        transition:background .15s, transform .1s; }
      .media .ctrl button:hover{ background:#d9e6fe; }
      .media .ctrl button:active{ transform:scale(.92); }
      .media .ctrl button svg{ width:15px; height:15px; }
      .media .ctrl .play{ background:var(--accent); color:#fff; }
      .media .ctrl .play:hover{ background:#1f57cf; }

      .climate{ display:flex; align-items:center; justify-content:space-between; padding:14px 16px; }
      .climate .z{ text-align:center; flex:1; }
      .climate .z b{ font-size:21px; font-weight:600; color:var(--ink); }
      .climate .z span{ display:block; color:var(--dim); font-size:10.5px; letter-spacing:.4px; margin-top:3px; }
      .climate .mid{ display:flex; flex-direction:column; align-items:center; gap:3px; color:var(--accent);
        padding:0 14px; border-left:1px solid var(--line-2); border-right:1px solid var(--line-2); }
      .climate .mid svg{ width:20px; height:20px; }
      .climate .mid span{ font-size:10px; font-weight:600; letter-spacing:1px; color:var(--dim); }

      .dock{ display:flex; justify-content:space-between; gap:7px; }
      .dock .app{ flex:1; height:54px; border-radius:14px; background:var(--card); border:1px solid var(--line-2);
        display:flex; align-items:center; justify-content:center; color:#93a2b9; cursor:pointer;
        transition:transform .15s ease, background .15s, color .15s, box-shadow .15s; }
      .dock .app:hover{ transform:translateY(-2px); background:var(--card-2); color:var(--accent); }
      .dock .app svg{ width:22px; height:22px; }
      .dock .app.active{ background:var(--accent); color:#fff; border-color:transparent;
        box-shadow:0 8px 18px rgba(37,99,235,.30); }
      .dock .app.active:hover{ transform:translateY(-2px); background:#1f57cf; color:#fff; }

      /* ---- steering wheel silhouette (driver POV) ---- */
      .wheel{ position:absolute; left:50%; bottom:-196px; transform:translateX(-50%);
        width:560px; height:560px; z-index:1; opacity:.5; pointer-events:none; color:#9fb0c9; }

      .hint{ position:absolute; left:0; right:0; bottom:15px; text-align:center; z-index:4;
        color:var(--dim); font-size:12px; letter-spacing:.3px; }
      .hint b{ color:var(--accent); }

      @keyframes eq{ 0%,100%{ transform:scaleY(.35); } 50%{ transform:scaleY(1); } }
      @keyframes pulse{ 0%,100%{ transform:scale(1); opacity:1; } 50%{ transform:scale(1.55); opacity:.45; } }
      @media (prefers-reduced-motion:reduce){ .media .eq i{ animation:none; } .live{ animation:none; } }

      @media (max-width:980px){
        .deck{ flex-direction:column; gap:20px; padding:20px 0 72px; }
        .cluster-pod{ flex:none; width:100%; align-self:stretch; }
        .podlabel{ position:static; bottom:auto; margin:12px 6px 0; }
        .console{ flex:none; width:100%; max-width:520px; }
        .headunit{ height:auto; justify-content:flex-start; }
        .wheel{ width:420px; bottom:-236px; }
      }
      @media (max-width:600px){
        .cockpit{ padding:15px 15px 0; }
        .byline{ display:none; }
        .wheel{ display:none; }
      }
    </style>
  </head>
  <body>
    <div class="cockpit">
      <header class="topbar">
        <div class="brand">
          <svg class="mark" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <circle cx="20" cy="20" r="17" stroke="#2563eb" stroke-width="2.4"/>
            <path d="M20 20L28 13" stroke="#2563eb" stroke-width="2.8" stroke-linecap="round"/>
            <circle cx="20" cy="20" r="3.4" fill="#2563eb"/>
            <path d="M20 6.5v3M33.5 20h-3M20 33.5v-3M6.5 20h3" stroke="#9fb6e8" stroke-width="2.2" stroke-linecap="round"/>
          </svg>
          <span>AUTOMOTIVE <b>HMI</b> CLUSTER</span>
        </div>
        <div class="byline">Real-time, data-driven cockpit · Yuhan Wu</div>
      </header>

      <div class="deck">
        <!-- instrument cluster: the live Unity screen -->
        <div class="cluster-pod">
          <div class="bezel">
            <div class="screen">
              <canvas id="unity-canvas" tabindex="-1"></canvas>
              <div id="loading">
                <div class="lt">HMI&nbsp;<b>CLUSTER</b></div>
                <div id="bar"><i></i></div>
                <div id="pct">LOADING 0%</div>
              </div>
            </div>
          </div>
          <div class="podlabel"><span class="live"></span>Instrument cluster · live</div>
        </div>

        <!-- center console: car head-unit / infotainment -->
        <aside class="console">
          <div class="headunit">
            <div class="hu-status">
              <span class="clock num" id="hu-clock">9:41</span>
              <span class="right">
                <svg class="ic" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="2" y="15" width="3" height="5" rx="1"/><rect x="8" y="11" width="3" height="9" rx="1"/><rect x="14" y="7" width="3" height="13" rx="1"/><rect x="20" y="3" width="3" height="17" rx="1" opacity=".35"/></svg>
                <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M8 8l8 8-4 4V4l4 4-8 8"/></svg>
                <span class="wx" id="hu-weather">Connected · 22°C</span>
              </span>
            </div>

            <div class="card nav">
              <svg class="map" viewBox="0 0 360 138" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
                <rect width="360" height="138" fill="#e9f0f9"/>
                <rect x="30" y="16" width="46" height="30" rx="4" fill="#dde7f3"/>
                <rect x="250" y="70" width="60" height="40" rx="4" fill="#dde7f3"/>
                <rect x="150" y="96" width="50" height="34" rx="4" fill="#dde7f3"/>
                <path d="M-20 100 L135 54 L225 86 L390 34" stroke="#d0dcec" stroke-width="15" fill="none" stroke-linecap="round"/>
                <path d="M64 -10 L112 72 L90 156" stroke="#d0dcec" stroke-width="10" fill="none"/>
                <path d="M275 -10 L237 64 L292 156" stroke="#d0dcec" stroke-width="10" fill="none"/>
                <path d="M-20 100 L135 54 L225 86" stroke="#ffffff" stroke-width="11" fill="none" stroke-linecap="round"/>
                <path d="M-20 100 L135 54 L225 86" stroke="#2563eb" stroke-width="6" fill="none" stroke-linecap="round"/>
                <circle cx="135" cy="54" r="7.5" fill="#2563eb" stroke="#ffffff" stroke-width="3"/>
              </svg>
              <div class="navinfo">
                <span class="arrow" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 19V11a3 3 0 0 1 3-3h7"/><path d="M13 4l5 4-5 4"/></svg>
                </span>
                <span class="nroad">
                  <div class="road" id="nav-road">I-405 N</div>
                  <div class="eta" id="nav-eta">12 min · arrive 8:53</div>
                </span>
                <span class="dist"><b class="num" id="nav-dist">2.3</b><span>miles</span></span>
              </div>
            </div>

            <div class="card media">
              <div class="art" aria-hidden="true"><span class="eq"><i></i><i></i><i></i></span></div>
              <div class="meta">
                <div class="title">Midnight City</div>
                <div class="artist">M83</div>
                <div class="prog"><i id="media-prog"></i></div>
              </div>
              <div class="ctrl">
                <button aria-label="Previous"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3 6l9 6V6z"/></svg></button>
                <button class="play" aria-label="Pause"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 5h4v14H7zm6 0h4v14h-4z"/></svg></button>
                <button aria-label="Next"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 6l9 6-9 6z"/></svg></button>
              </div>
            </div>

            <div class="card climate">
              <div class="z"><b class="num">21°</b><span>Driver</span></div>
              <div class="mid">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M12 12c0-3 4-3 4-6a3 3 0 0 0-5-2M12 12c3 0 3 4 6 4a3 3 0 0 0 2-5M12 12c0 3-4 3-4 6a3 3 0 0 0 5 2M12 12c-3 0-3-4-6-4a3 3 0 0 0-2 5"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/></svg>
                <span>Auto</span>
              </div>
              <div class="z"><b class="num">22°</b><span>Passenger</span></div>
            </div>

            <div class="dock">
              <div class="app active" aria-label="Navigation"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 2l3.5 16L12 15l-3.5 3z" fill="#fff" stroke="#fff"/></svg></div>
              <div class="app" aria-label="Media"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="7" cy="18" r="2.4"/><circle cx="18" cy="16" r="2.4"/><path d="M9.4 18V6l11-2v12"/></svg></div>
              <div class="app" aria-label="Phone"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3l3 1 1 4-2 2a12 12 0 0 0 5 5l2-2 4 1 1 3a2 2 0 0 1-2 2A16 16 0 0 1 4 5a2 2 0 0 1 2-2z"/></svg></div>
              <div class="app" aria-label="Climate"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 3v18M3 12h18M6 6l12 12M18 6L6 18"/></svg></div>
              <div class="app" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2.3"/><circle cx="8" cy="17" r="2.3"/></svg></div>
            </div>
          </div>
        </aside>
      </div>

      <svg class="wheel" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <circle cx="100" cy="100" r="92" stroke="currentColor" stroke-width="10"/>
        <circle cx="100" cy="100" r="80" stroke="currentColor" stroke-width="2" opacity=".5"/>
        <circle cx="100" cy="100" r="18" fill="currentColor"/>
        <path d="M100 118 V182" stroke="currentColor" stroke-width="12" stroke-linecap="round"/>
        <path d="M85 106 L30 148" stroke="currentColor" stroke-width="12" stroke-linecap="round"/>
        <path d="M115 106 L170 148" stroke="currentColor" stroke-width="12" stroke-linecap="round"/>
      </svg>

      <div class="hint">Press <b>`</b> to toggle controls · drag or click the cluster to interact</div>
    </div>

    <script>
      var pad = function (n) { return n < 10 ? "0" + n : "" + n; };
      var fmt = function (d) { return d.getHours() + ":" + pad(d.getMinutes()); };

      /* live clock */
      function tick(){ var el=document.getElementById("hu-clock"); if(el) el.textContent=fmt(new Date()); }
      tick(); setInterval(tick,10000);

      /* live navigation (mock until the Unity cluster links up and drives it) */
      var linked = false;             /* true once Unity pushes scenario state */
      var dist = 2.3;                 /* miles remaining */
      var speed = 34;                 /* avg mph */
      function navTick(){
        if (linked) return;           /* Unity is driving the nav now */
        dist = Math.round((dist - 0.1) * 10) / 10;
        if (dist <= 0.2) dist = 3.4;  /* next leg */
        var mins = Math.max(1, Math.round(dist / speed * 60));
        var arrive = new Date(Date.now() + mins * 60000);
        var dEl=document.getElementById("nav-dist"); if(dEl) dEl.textContent = dist.toFixed(1);
        var eEl=document.getElementById("nav-eta");  if(eEl) eEl.textContent = mins + " min · arrive " + fmt(arrive);
      }
      navTick(); setInterval(navTick, 2600);

      /* ---- Unity scene linkage: head unit mirrors the live cluster scenario ---- */
      var TURN_SVG = {
        Left:     '<path d="M17 19V11a3 3 0 0 0-3-3H7"/><path d="M11 4L6 8l5 4"/>',
        Right:    '<path d="M7 19V11a3 3 0 0 1 3-3h7"/><path d="M13 4l5 4-5 4"/>',
        Slight:   '<path d="M8 20v-7l7-7"/><path d="M11 6h5v5"/>',
        Straight: '<path d="M12 20V6"/><path d="M6 11l6-6 6 6"/>'
      };
      var WEATHER_LABEL = { Clear:"Clear", Rain:"Rain", Thunderstorm:"Storm", Sandstorm:"Sandstorm" };
      function setArrow(turn){ var a=document.querySelector(".nav .arrow svg"); if(a) a.innerHTML = TURN_SVG[turn] || TURN_SVG.Straight; }
      function setText(id,t){ var e=document.getElementById(id); if(e) e.textContent = t; }
      window.HmiOnState = function (jsonStr) {
        var d; try { d = JSON.parse(jsonStr); } catch (e) { return; }
        linked = true;
        setText("hu-weather", (WEATHER_LABEL[d.weather] || "Clear") + " · 22°C");
        if (d.navTurn === "None") {
          setArrow("Straight");
          setText("nav-road", "No active route");
          setText("nav-dist", "—");
          setText("nav-eta", "Route guidance off");
          return;
        }
        setArrow(d.navTurn);
        if (d.navStreet) setText("nav-road", d.navStreet);
        var miles = (d.navDist || 0) / 1609;
        setText("nav-dist", miles.toFixed(1));
        var mph = d.speed > 1 ? d.speed * 0.621 : 30;
        var mins = Math.max(1, Math.round(miles / mph * 60));
        setText("nav-eta", mins + " min · arrive " + fmt(new Date(Date.now() + mins * 60000)));
      };

      /* live media progress */
      var mp = 0.42;
      function mediaTick(){
        mp += 0.03; if (mp > 1) mp = 0;
        var m=document.getElementById("media-prog"); if(m) m.style.transform = "scaleX(" + mp.toFixed(3) + ")";
      }
      setInterval(mediaTick, 900);

      /* Unity WebGL */
      var canvas = document.querySelector("#unity-canvas");
      var config = {
        arguments: [],
        dataUrl: "Build/WebGL.data.unityweb",
        frameworkUrl: "Build/WebGL.framework.js.unityweb",
        codeUrl: "Build/WebGL.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "HMI adjust system",
        productVersion: "1.2.0",
      };
      var s = document.createElement("script");
      s.src = "Build/WebGL.loader.js";
      s.onload = function () {
        createUnityInstance(canvas, config, function (p) {
          document.querySelector("#bar > i").style.transform = "scaleX(" + p + ")";
          document.querySelector("#pct").textContent = "LOADING " + Math.round(p * 100) + "%";
        }).then(function () {
          var l = document.querySelector("#loading");
          l.style.opacity = "0";
          setTimeout(function () { l.style.display = "none"; }, 550);
        }).catch(function (msg) { alert(msg); });
      };
      document.body.appendChild(s);
    </script>
  </body>
</html>
