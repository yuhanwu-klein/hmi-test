<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automotive HMI Cluster</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2016%2016'%3E%3Ccircle%20cx='8'%20cy='8'%20r='7'%20fill='%232563eb'/%3E%3C/svg%3E">
    <style>
      :root{
        --bg1:#eef2f8; --bg2:#d9e1ee; --surface:#ffffff;
        --screen:#0a0d12; --screen2:#131b28; --blue:#2f7bff; --blue-deep:#2563eb;
        --text:#16233b; --dim:#6b7a90; --line:rgba(20,40,80,.10);
        --ink:#e9eef7; --dim2:#8593a8; --line2:rgba(255,255,255,.08);
      }
      *{ box-sizing:border-box; }
      html,body{ margin:0; height:100%; color:var(--text);
        font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; }
      body{ min-height:100vh; background:radial-gradient(120% 90% at 50% -10%, var(--bg1), var(--bg2)); }

      .cockpit{ position:relative; min-height:100vh; display:flex; flex-direction:column;
        max-width:1440px; margin:0 auto; padding:20px 30px 0; overflow:hidden; }

      .topbar{ display:flex; align-items:baseline; justify-content:space-between; gap:16px; z-index:4; }
      .brand{ font-weight:700; letter-spacing:4px; font-size:18px; }
      .brand b{ color:var(--blue-deep); }
      .byline{ color:var(--dim); font-size:13px; letter-spacing:1px; }

      .deck{ position:relative; z-index:3; flex:1; display:flex; align-items:center;
        justify-content:center; gap:26px; padding:26px 0 90px; }

      /* ---- instrument cluster (Unity) ---- */
      .cluster-pod{ flex:1 1 720px; max-width:820px; min-width:0; }
      .bezel{ position:relative; aspect-ratio:16/9; border-radius:22px; overflow:hidden;
        background:var(--screen); padding:12px;
        border:1px solid var(--line); box-shadow:0 22px 55px rgba(20,40,80,.16); }
      .screen{ position:relative; width:100%; height:100%; border-radius:13px; overflow:hidden; background:#000; }
      #unity-canvas{ width:100%; height:100%; display:block; }
      .podlabel{ margin:10px 4px 0; color:var(--dim); font-size:11px; letter-spacing:2px; text-transform:uppercase; }

      #loading{ position:absolute; inset:0; z-index:5; display:flex; flex-direction:column;
        align-items:center; justify-content:center; gap:18px; background:var(--screen); transition:opacity .5s; }
      .lt{ font-weight:700; letter-spacing:6px; font-size:15px; color:var(--ink); }
      .lt b{ color:var(--blue); }
      #bar{ width:220px; height:4px; background:rgba(255,255,255,.12); border-radius:3px; overflow:hidden; }
      #bar>i{ display:block; height:100%; width:100%; background:var(--blue);
        transform:scaleX(0); transform-origin:left; transition:transform .2s; }
      #pct{ color:var(--dim2); font-size:11px; letter-spacing:3px; }

      /* ---- center console / head unit ---- */
      .console{ flex:0 0 356px; max-width:356px; }
      .headunit{ background:linear-gradient(180deg,#131b28,#0c121c); border-radius:22px;
        border:1px solid var(--line); box-shadow:0 22px 55px rgba(20,40,80,.16);
        padding:16px; color:var(--ink); display:flex; flex-direction:column; gap:14px; }
      .hu-status{ display:flex; align-items:center; justify-content:space-between;
        font-size:12px; color:var(--dim2); letter-spacing:.5px; }
      .hu-status .clock{ color:var(--ink); font-weight:600; letter-spacing:1px; }
      .hu-status .right{ display:flex; align-items:center; gap:9px; }
      .dot{ width:6px; height:6px; border-radius:50%; background:var(--blue); }

      .card{ background:var(--screen2); border:1px solid var(--line2); border-radius:14px; }

      .nav{ position:relative; height:132px; overflow:hidden; }
      .nav .map{ position:absolute; inset:0; width:100%; height:100%; }
      .nav .navinfo{ position:absolute; left:14px; bottom:12px; right:14px; display:flex; align-items:center; gap:12px; }
      .nav .arrow{ width:38px; height:38px; flex:none; display:flex; align-items:center; justify-content:center;
        background:var(--blue); border-radius:11px; }
      .nav .arrow svg{ width:22px; height:22px; }
      .nav .road{ font-weight:600; font-size:15px; }
      .nav .eta{ color:var(--dim2); font-size:12px; margin-top:2px; }
      .nav .dist{ margin-left:auto; text-align:right; }
      .nav .dist b{ font-size:17px; }
      .nav .dist span{ display:block; color:var(--dim2); font-size:11px; }

      .media{ display:flex; align-items:center; gap:12px; padding:12px; }
      .media .art{ width:46px; height:46px; border-radius:9px; flex:none;
        background:linear-gradient(135deg,var(--blue),#7aa8ff); }
      .media .meta{ min-width:0; flex:1; }
      .media .title{ font-weight:600; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
      .media .artist{ color:var(--dim2); font-size:12px; }
      .media .prog{ height:3px; background:rgba(255,255,255,.12); border-radius:2px; margin-top:8px; overflow:hidden; }
      .media .prog>i{ display:block; height:100%; width:42%; background:var(--blue); }
      .media .ctrl{ display:flex; gap:6px; }
      .media .ctrl button{ width:30px; height:30px; border:none; border-radius:8px; cursor:pointer;
        background:rgba(255,255,255,.06); color:var(--ink); display:flex; align-items:center; justify-content:center; }
      .media .ctrl button svg{ width:15px; height:15px; }
      .media .ctrl .play{ background:var(--blue); }

      .climate{ display:flex; align-items:center; justify-content:space-between; padding:12px 14px; }
      .climate .z{ text-align:center; }
      .climate .z b{ font-size:20px; font-weight:600; }
      .climate .z span{ display:block; color:var(--dim2); font-size:10px; letter-spacing:1px; margin-top:2px; }
      .climate .mid{ display:flex; align-items:center; gap:7px; color:var(--dim2); font-size:12px; }
      .climate .mid svg{ width:20px; height:20px; }

      .dock{ display:flex; justify-content:space-between; gap:6px; }
      .dock .app{ flex:1; height:52px; border-radius:12px; background:var(--screen2); border:1px solid var(--line2);
        display:flex; align-items:center; justify-content:center; color:var(--dim2); }
      .dock .app svg{ width:22px; height:22px; }
      .dock .app.active{ background:var(--blue); color:#fff; border-color:transparent; }

      /* ---- steering wheel silhouette (driver POV) ---- */
      .wheel{ position:absolute; left:50%; bottom:-190px; transform:translateX(-50%);
        width:560px; height:560px; z-index:1; opacity:.9; pointer-events:none; }

      .hint{ position:absolute; left:0; right:0; bottom:14px; text-align:center; z-index:4;
        color:var(--dim); font-size:12px; letter-spacing:.5px; }
      .hint b{ color:var(--blue-deep); }

      @media (max-width:980px){
        .deck{ flex-direction:column; gap:18px; padding:18px 0 70px; }
        .cluster-pod{ flex:none; width:100%; }
        .console{ flex:none; width:100%; max-width:520px; }
        .wheel{ width:420px; bottom:-230px; }
      }
      @media (max-width:600px){
        .cockpit{ padding:14px 14px 0; }
        .byline{ display:none; }
        .wheel{ display:none; }
      }
    </style>
  </head>
  <body>
    <div class="cockpit">
      <div class="topbar">
        <div class="brand">AUTOMOTIVE <b>HMI</b> CLUSTER</div>
        <div class="byline">Real-time, data-driven cockpit — Yuhan Wu</div>
      </div>

      <div class="deck">
        <!-- instrument cluster: the live Unity screen -->
        <div class="cluster-pod">
          <div class="bezel">
            <div class="screen">
              <canvas id="unity-canvas" tabindex="-1"></canvas>
              <div id="loading">
                <div class="lt">HMI&nbsp;<b>CLUSTER</b></div>
                <div id="bar"><i></i></div>
                <div id="pct">LOADING 0%</div>
              </div>
            </div>
          </div>
          <div class="podlabel">Instrument Cluster · live</div>
        </div>

        <!-- center console: car head-unit / infotainment -->
        <aside class="console">
          <div class="headunit">
            <div class="hu-status">
              <span class="clock" id="hu-clock">9:41</span>
              <span class="right"><span class="dot"></span>Connected&nbsp;·&nbsp;22°C</span>
            </div>

            <div class="card nav">
              <svg class="map" viewBox="0 0 356 132" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
                <rect width="356" height="132" fill="#0e1524"/>
                <path d="M-20 96 L130 52 L220 84 L380 34" stroke="#1d2942" stroke-width="14" fill="none" stroke-linecap="round"/>
                <path d="M60 -10 L108 70 L86 150" stroke="#1d2942" stroke-width="10" fill="none"/>
                <path d="M270 -10 L232 62 L286 150" stroke="#1d2942" stroke-width="10" fill="none"/>
                <path d="M-20 96 L130 52 L220 84" stroke="#2f7bff" stroke-width="6" fill="none" stroke-linecap="round"/>
                <circle cx="130" cy="52" r="7" fill="#2f7bff" stroke="#0e1524" stroke-width="3"/>
              </svg>
              <div class="navinfo">
                <span class="arrow" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 19V11a3 3 0 0 1 3-3h7"/><path d="M13 4l5 4-5 4"/></svg>
                </span>
                <span>
                  <div class="road">I-405 N</div>
                  <div class="eta">12 min · arrive 8:53</div>
                </span>
                <span class="dist"><b>2.3</b><span>MILES</span></span>
              </div>
            </div>

            <div class="card media">
              <div class="art" aria-hidden="true"></div>
              <div class="meta">
                <div class="title">Midnight City</div>
                <div class="artist">M83</div>
                <div class="prog"><i></i></div>
              </div>
              <div class="ctrl">
                <button aria-label="Previous"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3 6l9 6V6z"/></svg></button>
                <button class="play" aria-label="Pause"><svg viewBox="0 0 24 24" fill="#fff"><path d="M7 5h4v14H7zm6 0h4v14h-4z"/></svg></button>
                <button aria-label="Next"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 6l9 6-9 6z"/></svg></button>
              </div>
            </div>

            <div class="card climate">
              <div class="z"><b>21°</b><span>DRIVER</span></div>
              <div class="mid">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M12 12c0-3 4-3 4-6a3 3 0 0 0-5-2M12 12c3 0 3 4 6 4a3 3 0 0 0 2-5M12 12c0 3-4 3-4 6a3 3 0 0 0 5 2M12 12c-3 0-3-4-6-4a3 3 0 0 0-2 5"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/></svg>
                AUTO
              </div>
              <div class="z"><b>22°</b><span>PASSENGER</span></div>
            </div>

            <div class="dock">
              <div class="app active" aria-label="Navigation"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 2l3.5 16L12 15l-3.5 3z" fill="#fff" stroke="#fff"/></svg></div>
              <div class="app" aria-label="Media"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="7" cy="18" r="2.4"/><circle cx="18" cy="16" r="2.4"/><path d="M9.4 18V6l11-2v12"/></svg></div>
              <div class="app" aria-label="Phone"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3l3 1 1 4-2 2a12 12 0 0 0 5 5l2-2 4 1 1 3a2 2 0 0 1-2 2A16 16 0 0 1 4 5a2 2 0 0 1 2-2z"/></svg></div>
              <div class="app" aria-label="Climate"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 3v18M3 12h18M6 6l12 12M18 6L6 18"/></svg></div>
              <div class="app" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2.3"/><circle cx="8" cy="17" r="2.3"/></svg></div>
            </div>
          </div>
        </aside>
      </div>

      <svg class="wheel" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <circle cx="100" cy="100" r="92" stroke="#20304d" stroke-width="14" opacity=".9"/>
        <circle cx="100" cy="100" r="20" fill="#20304d"/>
        <path d="M100 120 V180" stroke="#20304d" stroke-width="13" stroke-linecap="round"/>
        <path d="M84 108 L28 150" stroke="#20304d" stroke-width="13" stroke-linecap="round"/>
        <path d="M116 108 L172 150" stroke="#20304d" stroke-width="13" stroke-linecap="round"/>
      </svg>

      <div class="hint">Press <b>`</b> to toggle controls · drag / click the cluster to interact</div>
    </div>

    <script>
      function tick(){ var d=new Date(),h=d.getHours(),m=d.getMinutes();
        var el=document.getElementById("hu-clock"); if(el) el.textContent=h+":"+(m<10?"0"+m:m); }
      tick(); setInterval(tick,10000);

      var canvas = document.querySelector("#unity-canvas");
      var config = {
        dataUrl: "Build/WebGL.data.unityweb",
        frameworkUrl: "Build/WebGL.framework.js.unityweb",
        codeUrl: "Build/WebGL.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Yuhan Wu",
        productName: "Automotive HMI Cluster",
        productVersion: "1.2.0",
      };
      var s = document.createElement("script");
      s.src = "Build/WebGL.loader.js";
      s.onload = function () {
        createUnityInstance(canvas, config, function (p) {
          document.querySelector("#bar > i").style.transform = "scaleX(" + p + ")";
          document.querySelector("#pct").textContent = "LOADING " + Math.round(p * 100) + "%";
        }).then(function () {
          var l = document.querySelector("#loading");
          l.style.opacity = "0";
          setTimeout(function () { l.style.display = "none"; }, 550);
        }).catch(function (msg) { alert(msg); });
      };
      document.body.appendChild(s);
    </script>
  </body>
</html>
