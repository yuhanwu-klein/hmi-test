<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automotive HMI Cluster</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2016%2016'%3E%3Ccircle%20cx='8'%20cy='8'%20r='7'%20fill='%232563eb'/%3E%3C/svg%3E">
    <style>
      :root{ --bg:#f6f8fc; --surface:#ffffff; --blue:#2563eb; --text:#16233b; --dim:#6b7a90; --line:rgba(20,40,80,.09); }
      *{ box-sizing:border-box; }
      html,body{ margin:0; height:100%; background:var(--bg); color:var(--text);
        font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; }
      body{ display:flex; flex-direction:column; min-height:100vh; }

      header{ display:flex; align-items:baseline; justify-content:space-between; gap:16px;
        padding:18px 34px; background:var(--surface); border-bottom:1px solid var(--line); }
      .brand{ font-weight:700; letter-spacing:4px; font-size:19px; }
      .brand b{ color:var(--blue); }
      .byline{ color:var(--dim); font-size:13px; letter-spacing:1px; }

      main{ flex:1; display:flex; align-items:center; justify-content:center; padding:26px; }
      .stage{ position:relative; width:100%; max-width:1440px; aspect-ratio:16/9;
        border-radius:16px; overflow:hidden; background:#0a0d12;
        border:1px solid var(--line);
        box-shadow:0 18px 50px rgba(20,40,80,.10); }
      #unity-canvas{ width:100%; height:100%; display:block; }

      #loading{ position:absolute; inset:0; z-index:5; display:flex; flex-direction:column;
        align-items:center; justify-content:center; gap:20px; background:var(--surface); transition:opacity .5s; }
      .lt{ font-weight:700; letter-spacing:6px; font-size:17px; color:var(--text); }
      .lt b{ color:var(--blue); }
      #bar{ width:240px; height:4px; background:rgba(20,40,80,.10); border-radius:3px; overflow:hidden; }
      #bar>i{ display:block; height:100%; width:100%; background:var(--blue);
        transform:scaleX(0); transform-origin:left; transition:transform .2s; }
      #pct{ color:var(--dim); font-size:12px; letter-spacing:3px; }

      footer{ display:flex; align-items:center; justify-content:space-between; gap:12px;
        padding:13px 34px; background:var(--surface); border-top:1px solid var(--line);
        color:var(--dim); font-size:12px; letter-spacing:.5px; }
      .hint b{ color:var(--blue); }

      @media (max-width:660px){
        header,footer{ padding:12px 16px; }
        .byline,footer .left{ display:none; }
        .stage{ border-radius:10px; }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">AUTOMOTIVE <b>HMI</b> CLUSTER</div>
      <div class="byline">Real-time, data-driven instrument cluster — Yuhan Wu</div>
    </header>

    <main>
      <div class="stage">
        <canvas id="unity-canvas" tabindex="-1"></canvas>
        <div id="loading">
          <div class="lt">HMI&nbsp;<b>CLUSTER</b></div>
          <div id="bar"><i></i></div>
          <div id="pct">LOADING 0%</div>
        </div>
      </div>
    </main>

    <footer>
      <div class="left">Built with Unity UI Toolkit · scenario &amp; weather driven</div>
      <div class="hint">Press <b>`</b> to toggle controls · drag / click to interact</div>
    </footer>

    <script>
      var canvas = document.querySelector("#unity-canvas");
      var config = {
        dataUrl: "Build/WebGL.data.unityweb",
        frameworkUrl: "Build/WebGL.framework.js.unityweb",
        codeUrl: "Build/WebGL.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Yuhan Wu",
        productName: "Automotive HMI Cluster",
        productVersion: "1.2.0",
      };
      var s = document.createElement("script");
      s.src = "Build/WebGL.loader.js";
      s.onload = function () {
        createUnityInstance(canvas, config, function (p) {
          document.querySelector("#bar > i").style.transform = "scaleX(" + p + ")";
          document.querySelector("#pct").textContent = "LOADING " + Math.round(p * 100) + "%";
        }).then(function () {
          var l = document.querySelector("#loading");
          l.style.opacity = "0";
          setTimeout(function () { l.style.display = "none"; }, 550);
        }).catch(function (msg) { alert(msg); });
      };
      document.body.appendChild(s);
    </script>
  </body>
</html>
